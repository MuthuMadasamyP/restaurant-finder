<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Restaurant Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css?v=20260608-login-no-icon" />
</head>
<body class="auth-page">
  <main class="auth-reference-screen">
    <section class="auth-reference-card">
      <div class="auth-reference-form" aria-labelledby="authTitle">
        <h2 id="authTitle">Login</h2>
        <p>Access your restaurant finder workspace.</p>
        <div id="authAlert" class="alert" style="display:none;"></div>
        <form id="authForm" autocomplete="off">
          <div class="form-group" id="nameGroup" hidden>
            <label for="authName">Name</label>
            <input type="text" id="authName" placeholder="Your name" />
          </div>
          <div class="form-group">
            <label for="authEmail">Username or Email</label>
            <input type="text" id="authEmail" placeholder="Enter username or email" required />
          </div>
          <div class="form-group">
            <label for="authPassword">Password</label>
            <input type="password" id="authPassword" placeholder="Password" required />
          </div>
          <label class="remember-row">
            <input type="checkbox" checked />
            <span>Remember me</span>
          </label>
          <button type="submit" id="authSubmitBtn" class="btn btn-primary">Login</button>
        </form>
        <div class="auth-switch-row">
          <span id="authSwitchText">New User?</span>
          <button type="button" id="authSwitchBtn">Signup</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/js/auth.js?v=20260608-token-redirect"></script>
</body>
</html>
